<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ttraigo | Multi Paradas</title>
<style>
body{
margin:0;
background:#05070A;
color:white;
font-family:Arial,sans-serif
}
.shell{
max-width:1200px;
margin:auto;
padding:24px
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px
}
.card{
background:#111827;
border-radius:24px;
padding:24px;
border:1px solid rgba(255,255,255,.08)
}
input,textarea{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid rgba(255,255,255,.1);
background:#1F2937;
color:white;
margin-top:10px
}
button{
padding:14px 18px;
border:0;
border-radius:16px;
background:#16C47F;
color:#06100C;
font-weight:900;
cursor:pointer;
margin-top:12px
}
.list{
display:grid;
gap:12px
}
.item{
padding:16px;
border-radius:18px;
background:#1A2330;
border:1px solid rgba(255,255,255,.08)
}
.route{
height:320px;
border-radius:22px;
background:
linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),
linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
#0B1218;
background-size:60px 60px;
position:relative;
overflow:hidden;
margin-top:20px
}
.path{
position:absolute;
left:90px;
top:80px;
width:520px;
height:180px;
border:6px solid #16C47F;
border-left:0;
border-bottom:0;
border-radius:0 120px 0 0
}
.car{
position:absolute;
left:240px;
top:180px;
width:70px;
height:70px;
background:white;
border-radius:22px;
display:grid;
place-items:center;
font-size:34px;
animation:drive 6s ease-in-out infinite
}
@keyframes drive{
0%,100%{transform:translate(-90px,-70px)}
50%{transform:translate(180px,10px)}
}
.pin{
position:absolute;
width:50px;
height:50px;
border-radius:18px;
display:grid;
place-items:center;
font-size:22px;
font-weight:900
}
.p1{left:70px;top:70px;background:#16C47F;color:#06100C}
.p2{left:300px;top:150px;background:#D8B76A;color:#06100C}
.p3{right:70px;bottom:60px;background:#EF4444}
@media(max-width:900px){
.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="shell">

<h1>Fase 17 — Multi Paradas y Rutas</h1>

<div class="grid">

<div class="card">
<h2>Crear ruta con paradas</h2>

<input id="servicio" placeholder="ID servicio">
<input id="direccion" placeholder="Dirección parada">

<button onclick="agregar()">Agregar parada</button>

<div class="route">
<div class="path"></div>
<div class="pin p1">1</div>
<div class="pin p2">2</div>
<div class="pin p3">3</div>
<div class="car">🚐</div>
</div>

<p id="msg"></p>
</div>

<div class="card">
<h2>Paradas registradas</h2>
<div id="lista" class="list"></div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=window.supabase.createClient(
"https://lvqzkvahfklwzxbxbljv.supabase.co",
"sb_publishable_A122LY08w-r23qZADKtXlA__zPm6E8Q"
);

async function agregar(){
 try{
  if(!servicio.value || !direccion.value)throw new Error('Completa servicio y dirección.');

  const prev=await supabaseClient.from('paradas_servicio')
  .select('*')
  .eq('servicio_id',servicio.value);

  const orden=(prev.data||[]).length+1;

  const r=await supabaseClient.from('paradas_servicio').insert([{
    servicio_id:servicio.value,
    orden_parada:orden,
    direccion:direccion.value
  }]);

  if(r.error)throw r.error;

  await supabaseClient.from('servicios')
  .update({
    tiene_paradas:true,
    total_paradas:orden
  })
  .eq('id',servicio.value);

  msg.textContent='Parada agregada';
  msg.style.color='#16C47F';

  direccion.value='';

  cargar();

 }catch(e){
  msg.textContent=e.message;
 }
}

async function cargar(){
 const r=await supabaseClient.from('paradas_servicio')
 .select('*')
 .order('creado_en',{ascending:false});

 const data=r.data||[];

 lista.innerHTML=data.map(x=>`
 <div class="item">
 <b>Servicio:</b> ${x.servicio_id}<br>
 <b>Parada:</b> ${x.orden_parada}<br>
 <b>Dirección:</b> ${x.direccion}<br>
 <b>Estado:</b> ${x.estado}
 </div>
 `).join('') || '<p>No hay paradas.</p>';
}

cargar();
</script>

</body>
</html>
