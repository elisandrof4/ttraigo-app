<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ttraigo | Seguimiento</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#05070A;--text:#F8FAFC;--muted:#AAB4C0;--green:#16C47F;--line:rgba(255,255,255,.12);--danger:#EF4444}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#05070A;color:var(--text)}
.map-full{position:fixed;inset:0;z-index:1;background:#071015}.map-fake{position:absolute;inset:0;background:linear-gradient(35deg,transparent 43%,rgba(22,196,127,.20) 44%,transparent 46%),linear-gradient(140deg,transparent 38%,rgba(255,255,255,.08) 39%,transparent 41%),radial-gradient(circle at 35% 35%,rgba(22,196,127,.22),transparent 18%),radial-gradient(circle at 70% 70%,rgba(37,99,235,.20),transparent 22%),#081016}#map{height:100%;width:100%}
.overlay{position:relative;z-index:5;min-height:100vh;pointer-events:none}.topbar{position:fixed;top:16px;left:16px;right:16px;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:auto}
.logo{display:flex;align-items:center;gap:10px}.mark{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--green),#0A8F63);display:grid;place-items:center;color:#05100C;font-weight:900;font-size:24px;box-shadow:0 16px 40px rgba(22,196,127,.26)}
.glass{background:rgba(5,7,10,.72);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.38)}.round{border-radius:24px}.icon-btn{width:44px;height:44px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);display:grid;place-items:center;font-weight:900}
.bottom-sheet{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;pointer-events:auto;border-radius:32px;padding:18px;background:rgba(8,13,20,.86);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(22px);box-shadow:0 -18px 70px rgba(0,0,0,.45)}
.handle{width:48px;height:5px;border-radius:999px;background:rgba(255,255,255,.18);margin:0 auto 16px}.input{width:100%;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.08);color:var(--text);padding:15px 16px;outline:none}.input::placeholder{color:#7C8795}select.input option{color:#111}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:20px;padding:16px 18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}.btn:active{transform:scale(.98)}.primary{background:var(--green);color:#06100C;box-shadow:0 18px 40px rgba(22,196,127,.26)}.dark{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line)}.danger{background:rgba(239,68,68,.16);color:#FCA5A5;border:1px solid rgba(239,68,68,.32)}
.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(22,196,127,.13);color:#8DF0C7;border:1px solid rgba(22,196,127,.25)}.pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 8px rgba(22,196,127,.12);animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(22,196,127,0)}}
.card-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.mini-card{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:20px;padding:12px}.mini-card b{display:block;font-size:14px}.mini-card span{font-size:12px;color:var(--muted)}
.driver-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.avatar{width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,#1F2937,#0F172A);display:grid;place-items:center;font-weight:900;color:var(--green);border:1px solid var(--line)}
.loader{width:20px;height:20px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;top:82px;left:16px;right:16px;z-index:30;display:none;padding:14px 16px;border-radius:20px;background:rgba(22,196,127,.14);border:1px solid rgba(22,196,127,.25);color:#B6F8DA;backdrop-filter:blur(16px);font-weight:800}.toast.show{display:block}
.hidden{display:none!important}@media(min-width:900px){.bottom-sheet{left:50%;right:auto;width:430px;transform:translateX(-50%)}.topbar{left:28px;right:28px}}@media(max-width:430px){.bottom-sheet{left:8px;right:8px;bottom:8px;padding:16px;border-radius:28px}.grid2{grid-template-columns:1fr}.card-row{grid-template-columns:1fr 1fr}}
</style></head><body><div class="map-full"><div id="map"></div></div><div id="toast" class="toast"></div><div class="overlay"><div class="topbar"><a class="logo glass round" style="padding:10px 14px" href="cliente.html"><div class="mark">T</div><div><b>Ttraigo</b><div class="muted" style="font-size:12px">Tracking en vivo</div></div></a><button class="icon-btn glass" onclick="beep()">🔔</button></div><section class="bottom-sheet"><div class="handle"></div><div class="driver-card"><div class="avatar">🚗</div><div style="flex:1"><b id="tituloEstado">Buscando chofer cercano</b><div id="subEstado" class="muted" style="font-size:13px">Te avisaremos cuando un chofer acepte.</div></div><div class="pulse"></div></div><div class="card-row"><div class="mini-card"><b id="eta">--</b><span>ETA</span></div><div class="mini-card"><b id="dist">--</b><span>Distancia</span></div><div class="mini-card"><b id="price">--</b><span>Total</span></div></div><div style="display:flex;gap:10px"><button class="btn dark" style="flex:1" onclick="recargar()">Actualizar</button><button class="btn danger" style="flex:1" onclick="cancelar()">Cancelar</button></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const SUPABASE_URL="https://lvqzkvahfklwzxbxbljv.supabase.co";
const SUPABASE_KEY="sb_publishable_A122LY08w-r23qZADKtXlA__zPm6E8Q";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function money(n){return "RD$ "+Number(n||0).toLocaleString("es-DO",{minimumFractionDigits:2,maximumFractionDigits:2})}
async function profile(){let s=await supabaseClient.auth.getSession();if(!s.data.session)return null;let id=s.data.session.user.id;let r=await supabaseClient.from("usuarios").select("*").eq("id",id).single();return r.data}
async function need(roles){let p=await profile();if(!p){location.href="login.html";return null}if(roles&&!roles.includes(p.rol)){alert("Sin permiso");location.href="index.html";return null}return p}
async function logout(){await supabaseClient.auth.signOut();location.href="login.html"}
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function beep(){try{new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{})}catch(e){}}

let sid=new URLSearchParams(location.search).get('servicio'),choferId=null,map=null,mk=null,service=null;
document.addEventListener('DOMContentLoaded',()=>{initMap();init();});
function initMap(){map=L.map('map',{zoomControl:false}).setView([18.4861,-69.9312],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:''}).addTo(map);}
async function init(){if(!sid){tituloEstado.textContent='No hay servicio activo';subEstado.textContent='Vuelve a pedir un servicio.';return;}await recargar();supabaseClient.channel('track-'+sid).on('postgres_changes',{event:'UPDATE',schema:'public',table:'servicios'},p=>{if(p.new.id===sid){service=p.new;choferId=p.new.chofer_id;render();beep();toast('Servicio actualizado: '+p.new.estado);}}).subscribe();setInterval(pos,3000);}
async function recargar(){let x=await supabaseClient.from('servicios').select('*').eq('id',sid).single();if(!x.data){tituloEstado.textContent='Servicio no encontrado';return;}service=x.data;choferId=service.chofer_id;render();pos();}
function render(){price.textContent=money(service.costo_total);dist.textContent=Number(service.distancia_km||0).toFixed(1)+' km';if(service.estado==='buscando_chofer'){tituloEstado.textContent='Buscando chofer cercano';subEstado.textContent='Estamos notificando a choferes disponibles.';eta.textContent='--';}else if(service.estado==='confirmado'){tituloEstado.textContent='Chofer confirmado';subEstado.textContent='Tu chofer va en camino.';eta.textContent='8 min';}else if(service.estado==='en_camino'){tituloEstado.textContent='Chofer en camino';subEstado.textContent='Mantente atento al mapa.';eta.textContent='6 min';}else if(service.estado==='en_progreso'){tituloEstado.textContent='Servicio en curso';subEstado.textContent='Viaje activo con seguimiento.';eta.textContent='En curso';}else if(service.estado==='finalizado'){tituloEstado.textContent='Servicio finalizado';subEstado.textContent='Gracias por usar Ttraigo.';eta.textContent='OK';}else{tituloEstado.textContent='Estado: '+service.estado;subEstado.textContent='Seguimiento activo';}}
async function pos(){if(!choferId)return;let x=await supabaseClient.from('disponibilidad_choferes').select('*').eq('chofer_id',choferId).single();if(x.data){let lat=x.data.latitud,lng=x.data.longitud;if(!mk){mk=L.marker([lat,lng]).addTo(map).bindPopup('Chofer Ttraigo');map.setView([lat,lng],15);}else{mk.setLatLng([lat,lng]);}}}
async function cancelar(){if(!sid)return;if(!confirm('¿Cancelar este servicio?'))return;await supabaseClient.from('servicios').update({estado:'cancelado'}).eq('id',sid);toast('Servicio cancelado');setTimeout(()=>location.href='cliente.html',1200);}
</script></body></html>
