<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ttraigo | Viajes Programados</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--bg:#05070A;--text:#F8FAFC;--muted:#AAB4C0;--green:#16C47F;--blue:#2563EB;--red:#EF4444;--gold:#D8B76A;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 8%,rgba(22,196,127,.18),transparent 30%),radial-gradient(circle at 90% 82%,rgba(37,99,235,.18),transparent 34%),#05070A;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.shell{max-width:1280px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.logo{display:flex;align-items:center;gap:12px}.mark{width:54px;height:54px;border-radius:20px;background:linear-gradient(135deg,#16C47F,#0A8F63);display:grid;place-items:center;color:#06100C;font-weight:900;font-size:28px}.muted{color:var(--muted)}.glass{background:rgba(8,13,20,.78);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 24px 90px rgba(0,0,0,.34);border-radius:30px;padding:20px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.stat,.card{border:1px solid var(--line);background:rgba(255,255,255,.065);border-radius:24px;padding:16px}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:28px;margin-top:8px}.btn{border:0;border-radius:18px;padding:14px 16px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--green);color:#06100C}.dark{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff}.gold{background:rgba(216,183,106,.16);border:1px solid rgba(216,183,106,.28);color:#F8DA91}.input{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:18px;padding:14px;color:#fff;outline:none}.badge{display:inline-flex;border-radius:999px;padding:7px 10px;background:rgba(22,196,127,.13);border:1px solid rgba(22,196,127,.25);color:#8DF0C7;font-size:12px;font-weight:900}.badge.red{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.25);color:#FCA5A5}.badge.gold{background:rgba(216,183,106,.15);border-color:rgba(216,183,106,.28);color:#F8DA91}.table{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:22px;padding:14px}.line{height:1px;background:var(--line);margin:16px 0}.mapbox{position:relative;min-height:510px;border-radius:30px;overflow:hidden;border:1px solid var(--line);background:#081016}.map{position:absolute;inset:0;background:linear-gradient(38deg,transparent 42%,rgba(22,196,127,.28) 43%,rgba(22,196,127,.28) 45%,transparent 46%),linear-gradient(142deg,transparent 37%,rgba(255,255,255,.11) 38%,rgba(255,255,255,.11) 40%,transparent 41%),radial-gradient(circle at 30% 30%,rgba(22,196,127,.25),transparent 20%),radial-gradient(circle at 72% 72%,rgba(37,99,235,.26),transparent 26%),#0B1218}.pin{position:absolute;width:18px;height:18px;border-radius:50%;background:#16C47F;box-shadow:0 0 0 12px rgba(22,196,127,.12)}.pin.red{background:#EF4444}.float{position:absolute;left:16px;right:16px;bottom:16px;border-radius:26px;padding:16px;background:rgba(8,13,20,.84);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px)}.toast{position:fixed;top:16px;left:16px;right:16px;z-index:50;display:none;padding:14px 16px;border-radius:20px;background:rgba(22,196,127,.14);border:1px solid rgba(22,196,127,.25);color:#B6F8DA;backdrop-filter:blur(16px);font-weight:800}.toast.show{display:block}@media(max-width:950px){.grid,.grid3,.grid4{grid-template-columns:1fr}.shell{padding:14px}.row{grid-template-columns:1fr}}</style></head><body><div id="toast" class="toast"></div><main class="shell"><div class="top"><a class="logo" href="cliente.html"><div class="mark">T</div><div><b>Viajes Programados</b><div class="muted">Reservas premium y médicas</div></div></a><a class="btn dark" href="cliente.html">Cliente</a></div><section class="grid"><div class="glass"><h1 style="margin-top:0">Programar viaje</h1><div class="grid3"><input id="nombre" class="input" placeholder="Pasajero"><input id="telefono" class="input" placeholder="Teléfono"><input id="fecha" class="input" type="datetime-local"></div><input id="origen" class="input" style="margin-top:10px" placeholder="Origen"><input id="destino" class="input" style="margin-top:10px" placeholder="Destino"><select id="asistencia" class="input" style="margin-top:10px"><option>Regular</option><option>Paciente</option><option>Adulto mayor</option><option>Silla de ruedas</option><option>Hospital / clínica</option><option>Acompañante obligatorio</option></select><textarea id="nota" class="input" style="margin-top:10px" placeholder="Nota especial"></textarea><button class="btn primary" style="width:100%;margin-top:12px" onclick="crear()">Programar viaje</button></div><div class="glass"><h2 style="margin-top:0">Reservas</h2><div id="list" class="table"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://lvqzkvahfklwzxbxbljv.supabase.co";const SUPABASE_KEY="sb_publishable_A122LY08w-r23qZADKtXlA__zPm6E8Q";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);function esc(t){return String(t||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function money(n){return "RD$ "+Number(n||0).toLocaleString("es-DO",{minimumFractionDigits:2,maximumFractionDigits:2})}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}async function profile(){let s=await supabaseClient.auth.getSession();if(!s.data.session)return null;let id=s.data.session.user.id;let r=await supabaseClient.from("usuarios").select("*").eq("id",id).single();return r.data}let pr=null;document.addEventListener('DOMContentLoaded',async()=>{pr=await profile();load();});async function load(){let r=await supabaseClient.from('viajes_programados').select('*').order('fecha_programada',{ascending:true}).limit(40);list.innerHTML=(r.data||[]).map(v=>`<div class="row"><div><b>${esc(v.origen)} → ${esc(v.destino)}</b><div class="muted">${esc(v.nombre_pasajero)} · ${new Date(v.fecha_programada).toLocaleString()} · ${esc(v.asistencia)}</div></div><span class="badge gold">${esc(v.estado)}</span></div>`).join('')||'<p class="muted">No hay viajes programados.</p>';}async function crear(){if(!fecha.value||!origen.value||!destino.value)return toast('Completa fecha, origen y destino');let r=await supabaseClient.from('viajes_programados').insert([{usuario_id:pr?.id||null,nombre_pasajero:nombre.value,telefono_pasajero:telefono.value,origen:origen.value,destino:destino.value,fecha_programada:new Date(fecha.value).toISOString(),asistencia:asistencia.value,estado:'programado'}]);if(r.error)return toast(r.error.message);toast('Viaje programado');load();}</script></body></html>
