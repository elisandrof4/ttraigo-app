<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ttraigo Admin SOS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#05070A;--text:#F8FAFC;--muted:#AAB4C0;--green:#16C47F;--blue:#2563EB;--red:#EF4444;--gold:#D8B76A;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% 10%,rgba(239,68,68,.16),transparent 30%),radial-gradient(circle at 88% 82%,rgba(22,196,127,.16),transparent 34%),#05070A;color:var(--text)}a{text-decoration:none;color:inherit}
.shell{max-width:1120px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.logo{display:flex;align-items:center;gap:12px}.mark{width:54px;height:54px;border-radius:20px;background:linear-gradient(135deg,#16C47F,#0A8F63);display:grid;place-items:center;color:#06100C;font-weight:900;font-size:28px;box-shadow:0 24px 60px rgba(22,196,127,.26)}
.glass{background:rgba(8,13,20,.78);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 24px 90px rgba(0,0,0,.34);border-radius:30px;padding:20px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);background:rgba(255,255,255,.065);border-radius:24px;padding:16px}
.btn{border:0;border-radius:20px;padding:15px 18px;font-weight:900;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}.primary{background:var(--green);color:#06100C;box-shadow:0 18px 42px rgba(22,196,127,.24)}.dark{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff}.danger{background:var(--red);color:#fff;box-shadow:0 18px 42px rgba(239,68,68,.25)}.gold{background:rgba(216,183,106,.16);border:1px solid rgba(216,183,106,.28);color:#F8DA91}
.input{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:18px;padding:14px;color:#fff;outline:none}.input::placeholder{color:#7C8795}
.sos{width:170px;height:170px;border-radius:50%;border:0;background:radial-gradient(circle,#FF6B6B,#EF4444);color:#fff;font-size:42px;font-weight:900;box-shadow:0 0 0 12px rgba(239,68,68,.12),0 30px 90px rgba(239,68,68,.4);animation:sosPulse 1.3s infinite;display:grid;place-items:center;margin:20px auto;cursor:pointer}@keyframes sosPulse{50%{box-shadow:0 0 0 24px rgba(239,68,68,0),0 30px 90px rgba(239,68,68,.45)}}
.badge{display:inline-flex;gap:7px;align-items:center;padding:8px 11px;border-radius:999px;background:rgba(22,196,127,.13);color:#8DF0C7;border:1px solid rgba(22,196,127,.25);font-size:12px;font-weight:900}.badge.red{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.25);color:#FCA5A5}
.row{display:flex;justify-content:space-between;gap:10px;margin:10px 0}.line{height:1px;background:var(--line);margin:16px 0}.toast{position:fixed;top:16px;left:16px;right:16px;z-index:50;display:none;padding:14px 16px;border-radius:20px;background:rgba(22,196,127,.14);border:1px solid rgba(22,196,127,.25);color:#B6F8DA;backdrop-filter:blur(16px);font-weight:800}.toast.show{display:block}
.mapbox{position:relative;min-height:420px;border-radius:30px;overflow:hidden;border:1px solid var(--line);background:#081016}.map{position:absolute;inset:0;background:linear-gradient(38deg,transparent 42%,rgba(239,68,68,.24) 43%,rgba(239,68,68,.24) 45%,transparent 46%),linear-gradient(142deg,transparent 37%,rgba(255,255,255,.10) 38%,rgba(255,255,255,.10) 40%,transparent 41%),radial-gradient(circle at 30% 30%,rgba(239,68,68,.22),transparent 20%),radial-gradient(circle at 72% 72%,rgba(22,196,127,.24),transparent 26%),#0B1218}.float{position:absolute;left:16px;right:16px;bottom:16px;border-radius:26px;padding:16px;background:rgba(8,13,20,.82);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px)}
@media(max-width:900px){.grid,.grid3{grid-template-columns:1fr}.shell{padding:14px}.top{align-items:flex-start}.sos{width:150px;height:150px}}
</style>
<script>
window.TTRAIGO_DEMO = new URLSearchParams(location.search).get('demo') === '1';
window.TTRAIGO_DEMO_PROFILE = {id:'demo-user', rol:'cliente', nombre:'Demo Ttraigo', telefono:'8090000000'};
</script>

</head><body><div id="toast" class="toast"></div><main class="shell"><div class="top"><a class="logo" href="admin.html"><div class="mark">T</div><div><b style="font-size:23px">Centro SOS</b><div class="muted">Monitoreo de alertas</div></div></a><a class="btn dark" href="admin.html">Admin</a></div><section class="glass"><h1>Alertas SOS</h1><p class="muted">Alertas activas y eventos de seguridad.</p><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://lvqzkvahfklwzxbxbljv.supabase.co";
const SUPABASE_KEY="sb_publishable_A122LY08w-r23qZADKtXlA__zPm6E8Q";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function esc(t){return String(t||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function profile(){let s=await supabaseClient.auth.getSession();if(!s.data.session)return null;let id=s.data.session.user.id;let r=await supabaseClient.from("usuarios").select("*").eq("id",id).single();return r.data}
async function need(){let p=await profile();if(!p){ if(window.TTRAIGO_DEMO) return window.TTRAIGO_DEMO_PROFILE; location.href='login.html';return null}return p}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function code(){return 'TTG-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Date.now().toString().slice(-4)}

document.addEventListener('DOMContentLoaded',()=>{load();supabaseClient.channel('sos-admin').on('postgres_changes',{event:'INSERT',schema:'public',table:'alertas_sos'},p=>{toast('Nueva alerta SOS');load();}).subscribe();});
async function load(){let x=await supabaseClient.from('alertas_sos').select('*').order('creado_en',{ascending:false});list.innerHTML=(x.data||[]).map(a=>`<div class="card" style="margin:10px 0"><span class="badge red">${esc(a.estado)}</span><h3>Servicio: ${esc(a.servicio_id||'sin servicio')}</h3><p class="muted">${esc(a.mensaje)} · ${new Date(a.creado_en).toLocaleString()}</p><button class="btn primary" onclick="resolver('${a.id}')">Marcar atendida</button></div>`).join('')||'<p class="muted">No hay alertas.</p>';}
async function resolver(id){await supabaseClient.from('alertas_sos').update({estado:'atendida',atendido_en:new Date().toISOString()}).eq('id',id);toast('Alerta atendida');load();}
</script></body></html>
