<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ttraigo Cliente Mapbox</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet">
<style>body{margin:0;background:#05070A;color:white;font-family:Arial,sans-serif}
.shell{max-width:1350px;margin:auto;padding:20px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:18px;background:#16C47F;color:#06100C;display:grid;place-items:center;font-size:28px;font-weight:900}
.grid{display:grid;grid-template-columns:380px 1fr;gap:18px}
.card{background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:20px}
.map{height:720px;border-radius:24px;overflow:hidden;background:#0B1218}
input,select,textarea{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:#1F2937;color:white;margin-top:10px;box-sizing:border-box}
button,.btn{padding:14px 16px;border:0;border-radius:16px;background:#16C47F;color:#06100C;font-weight:900;cursor:pointer;margin-top:10px;text-decoration:none;display:inline-block}
.dark{background:#202B3B;color:white}.danger{background:#EF4444;color:white}
.item{padding:14px;border-radius:18px;background:#1A2330;border:1px solid rgba(255,255,255,.08);margin-top:10px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(22,196,127,.16);color:#8DF0C7;font-weight:900;font-size:12px}
.muted{color:#AAB4C0;line-height:1.55}
@media(max-width:960px){.grid{grid-template-columns:1fr}.map{height:540px}}</style>
</head>
<body>
<div class="shell">
<nav class="nav">
<div class="brand"><div class="logo">T</div><div><b>Ttraigo Cliente Mapbox</b><div class="muted">Mapbox real + GPS realtime</div></div></div>
<div><a class="btn dark" href="index.html">Inicio</a> <a class="btn dark" href="login.html">Login</a></div>
</nav>

<section class="grid">
<div class="card">
<h2>Cliente — pedir servicio con mapa real</h2>
<p class="muted">Activa tu GPS, registra origen/destino y guarda el servicio con coordenadas reales.</p>
<input id="origen" placeholder="Origen / punto de recogida">
<input id="destino" placeholder="Destino">
<select id="tipo"><option value="viaje">Viaje</option><option value="medico">Cita médica</option><option value="acompanante">Con acompañante</option></select>
<button onclick="activarGPS()">Activar mi ubicación</button>
<button class="dark" onclick="crearServicio()">Crear servicio con mapa</button>
<button class="dark" onclick="trazarDemo()">Trazar ruta demo</button>
<p id="msg"></p>
<div class="item">Lat: <b id="lat">--</b></div>
<div class="item">Lng: <b id="lng">--</b></div>
<div class="item">Servicio: <b id="sid">--</b></div>
<div id="servicios"></div>
</div>
<div class="card"><div id="map" class="map"></div></div>
</section>

</div>
<script src="config-mapas.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ttraigo-mapbox-core.js"></script>
<script>
const supabaseClient = window.supabase.createClient(TTRAIGO_SUPABASE_URL, TTRAIGO_SUPABASE_KEY);
let perfil=null, map=null, myMarker=null, watchId=null, servicioActual=null;
const ROL="cliente";
function msg(t,c='white'){document.getElementById('msg').textContent=t;document.getElementById('msg').style.color=c}

async function init(){
 perfil = await ttraigoGetSessionOrLogin(supabaseClient);
 if(!perfil) return;
 map = ttraigoCreateMap('map');
 cargarServicios();
}
function activarGPS(){
 watchId = ttraigoWatchGPS({
   supabaseClient, perfil, rol:'cliente', servicioId: servicioActual,
   onPosition: p => {
     lat.textContent=p.lat.toFixed(6); lng.textContent=p.lng.toFixed(6);
     if(myMarker) myMarker.setLngLat([p.lng,p.lat]); else myMarker=ttraigoMarker(map,p.lng,p.lat,'#3B82F6','<b>Cliente</b>');
     map.flyTo({center:[p.lng,p.lat], zoom:15});
     msg('GPS cliente activo.','#16C47F');
   },
   onError: e => msg('Error GPS: '+e,'#EF4444')
 });
}
async function crearServicio(){
 try{
  const latv=parseFloat(lat.textContent), lngv=parseFloat(lng.textContent);
  if(!origen.value || !destino.value) throw new Error('Completa origen y destino.');
  const total = tipo.value==='acompanante' ? 1250 : 650;
  const r=await supabaseClient.from('servicios').insert([{
    cliente_id:perfil.id,
    nombre_cliente:perfil.nombre || perfil.email,
    origen:origen.value,
    destino:destino.value,
    tipo_servicio:tipo.value,
    origen_lat:isNaN(latv)?null:latv,
    origen_lng:isNaN(lngv)?null:lngv,
    cliente_lat:isNaN(latv)?null:latv,
    cliente_lng:isNaN(lngv)?null:lngv,
    estado:'pendiente',
    tracking_estado:'pendiente',
    mapa_real_activo:true,
    total_estimado:total
  }]).select().single();
  if(r.error) throw r.error;
  servicioActual=r.data.id; sid.textContent=servicioActual;
  msg('Servicio creado con ubicación real.','#16C47F');
  cargarServicios();
 }catch(e){msg(e.message,'#EF4444')}
}
async function cargarServicios(){
 const r=await supabaseClient.from('servicios').select('*').eq('cliente_id',perfil.id).order('creado_en',{ascending:false}).limit(8);
 const data=r.data||[];
 servicios.innerHTML=data.map(s=>`<div class="item"><b>${ttraigoEscape(s.origen)} → ${ttraigoEscape(s.destino)}</b><br>${s.estado} · ${ttraigoMoney(s.total_estimado)}<br><button class="dark" onclick="servicioActual='${s.id}';sid.textContent='${s.id}'">Seguir</button></div>`).join('');
}
async function trazarDemo(){
 if(!myMarker){msg('Activa GPS primero.','#EF4444');return}
 const c=myMarker.getLngLat();
 const destinoLng=c.lng+0.025, destinoLat=c.lat+0.018;
 ttraigoMarker(map,destinoLng,destinoLat,'#EF4444','<b>Destino demo</b>');
 const info=await ttraigoRoute(map,c.lng,c.lat,destinoLng,destinoLat);
 if(info) msg(`Ruta: ${info.distanceKm.toFixed(2)} km · ${info.durationMin} min`,'#16C47F');
}
init();

</script>
</body>
</html>
