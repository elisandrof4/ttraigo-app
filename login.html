<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ttraigo | Login</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--text:#F8FAFC;--muted:#AAB4C0;--green:#16C47F;--line:rgba(255,255,255,.13)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 12% 9%,rgba(22,196,127,.22),transparent 32%),radial-gradient(circle at 90% 88%,rgba(37,99,235,.18),transparent 38%),#05070A;color:var(--text)}a{text-decoration:none;color:inherit}.shell{max-width:1160px;margin:auto;padding:26px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;align-items:center;gap:13px}.mark{width:56px;height:56px;border-radius:21px;background:linear-gradient(135deg,#16C47F,#0A8F63);display:grid;place-items:center;color:#06100C;font-weight:900;font-size:30px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:12px 16px;color:#D7DEE9;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}.panel{border:1px solid var(--line);background:rgba(255,255,255,.075);backdrop-filter:blur(18px);border-radius:30px;padding:24px;box-shadow:0 34px 100px rgba(0,0,0,.38)}.tabs{display:flex;gap:10px;margin-bottom:18px}.tab{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:18px;padding:14px;font-weight:900;cursor:pointer}.tab.active{background:var(--green);color:#06100C}h1{font-size:40px;margin:10px 0}.muted{color:var(--muted);line-height:1.55}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.input{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:18px;padding:15px;color:#fff;outline:none}select.input option{color:#111}.file{display:block;border:1px dashed rgba(255,255,255,.23);border-radius:20px;padding:14px;color:#AAB4C0;background:rgba(255,255,255,.04);margin-top:14px}.preview{width:86px;height:86px;object-fit:cover;border-radius:20px;border:1px solid var(--line);margin-top:10px}.btn{border:0;border-radius:20px;padding:16px 18px;font-weight:900;cursor:pointer;display:flex;justify-content:center;align-items:center}.primary{background:var(--green);color:#06100C;box-shadow:0 18px 42px rgba(22,196,127,.25)}.dark{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}.hidden{display:none!important}.message{font-weight:800;line-height:1.5;white-space:pre-wrap}.phone{position:relative;min-height:690px;border-radius:46px;overflow:hidden;background:#071015;border:1px solid rgba(255,255,255,.16)}.map{position:absolute;inset:0;background:linear-gradient(38deg,transparent 42%,rgba(22,196,127,.28) 43%,rgba(22,196,127,.28) 45%,transparent 46%),linear-gradient(142deg,transparent 37%,rgba(255,255,255,.12) 38%,rgba(255,255,255,.12) 40%,transparent 41%),radial-gradient(circle at 30% 30%,rgba(22,196,127,.26),transparent 20%),#0B1218}.route{position:absolute;left:86px;top:105px;width:260px;height:405px;border:5px solid rgba(22,196,127,.82);border-left:0;border-bottom:0;border-radius:0 135px 0 0}.car{position:absolute;left:250px;top:318px;width:56px;height:56px;border-radius:21px;background:#fff;color:#06100C;display:grid;place-items:center;font-size:29px;animation:drive 5s ease-in-out infinite}@keyframes drive{0%,100%{transform:translate(0,0)}50%{transform:translate(42px,-76px)}}.topline{position:absolute;top:22px;left:22px;right:22px;display:flex;justify-content:space-between}.mini{padding:10px 12px;border-radius:22px;background:rgba(5,7,10,.72);border:1px solid var(--line);font-weight:900}.status{padding:10px 12px;border-radius:999px;color:#8DF0C7;font-size:12px;font-weight:900;background:rgba(22,196,127,.13)}.bottom{position:absolute;left:16px;right:16px;bottom:16px;border-radius:30px;padding:18px;background:rgba(8,13,20,.88);border:1px solid rgba(255,255,255,.14)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:18px;padding:10px}.stat b{display:block;font-size:15px}.stat span{font-size:11px;color:#AAB4C0}@media(max-width:900px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.phone{min-height:520px}}
</style></head><body><main class="shell"><nav class="nav"><a class="brand" href="index.html"><div class="mark">T</div><div><b>Ttraigo</b><div class="muted">Acceso real</div></div></a><a class="pill" href="index.html">Volver</a></nav><section class="grid"><div class="panel"><div class="tabs"><button id="tabReg" class="tab active" onclick="showTab('reg')">Crear cuenta</button><button id="tabLog" class="tab" onclick="showTab('log')">Entrar</button></div><div id="registerBox"><h1>Crear cuenta</h1><p class="muted">Foto de perfil y cédula/ID obligatorias para todos. El celular permite cámara o galería.</p><div class="formgrid"><input id="n" class="input" placeholder="Nombre completo"><input id="t" class="input" placeholder="Teléfono"><input id="c" class="input" placeholder="Cédula / ID"><input id="e" class="input" placeholder="Email"><input id="p" type="password" class="input" placeholder="Contraseña mínimo 6 caracteres"><select id="r" class="input" onchange="roleFields()"><option value="cliente">Cliente</option><option value="chofer">Chofer</option><option value="acompanante">Acompañante</option></select></div><label class="file"><b>Foto perfil obligatoria</b><input id="f" type="file" accept="image/*" capture="user" class="input" style="margin-top:10px" onchange="previewFile('f','prevPerfil')"></label><img id="prevPerfil" class="preview hidden"><label class="file"><b>Foto cédula/ID obligatoria</b><input id="idfoto" type="file" accept="image/*" capture="environment" class="input" style="margin-top:10px" onchange="previewFile('idfoto','prevIdFoto')"></label><img id="prevIdFoto" class="preview hidden"><div id="driverFields" class="hidden" style="margin-top:16px"><div class="panel" style="padding:16px;background:rgba(18,52,77,.32)"><h3 style="margin-top:0;color:var(--green)">Documentos del chofer</h3><div class="formgrid"><input id="lic" class="input" placeholder="Número de licencia"><input id="marca" class="input" placeholder="Marca vehículo"><input id="modelo" class="input" placeholder="Modelo vehículo"><input id="placa" class="input" placeholder="Placa"></div><div class="formgrid" style="margin-top:12px"><label class="file">Foto vehículo<input id="fveh" type="file" accept="image/*" capture="environment" class="input" onchange="previewFile('fveh','pveh')"><img id="pveh" class="preview hidden"></label><label class="file">Foto licencia<input id="flic" type="file" accept="image/*" capture="environment" class="input" onchange="previewFile('flic','plic')"><img id="plic" class="preview hidden"></label><label class="file">Foto seguro<input id="fseg" type="file" accept="image/*" capture="environment" class="input" onchange="previewFile('fseg','pseg')"><img id="pseg" class="preview hidden"></label><label class="file">Matrícula / carta de ruta<input id="fdoc" type="file" accept="image/*" capture="environment" class="input" onchange="previewFile('fdoc','pdoc')"><img id="pdoc" class="preview hidden"></label></div></div></div><div id="compFields" class="hidden" style="margin-top:16px"><textarea id="exp" class="input" placeholder="Experiencia con pacientes o acompañamiento"></textarea></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="reg()">Crear cuenta</button><p id="m1" class="message"></p></div><div id="loginBox" class="hidden"><h1>Entrar</h1><input id="le" class="input" placeholder="Email"><input id="lp" type="password" class="input" style="margin-top:12px" placeholder="Contraseña"><button class="btn primary" style="width:100%;margin-top:18px" onclick="log()">Entrar</button><p id="m2" class="message"></p></div></div><div class="phone"><div class="map"></div><div class="route"></div><div class="car">🚘</div><div class="topline"><div class="mini">Ttraigo</div><div class="status">SEGURO</div></div><div class="bottom"><b>Identidad protegida</b><p class="muted">Foto + cédula/ID + acceso por rol</p><div class="stats"><div class="stat"><b>Foto</b><span>Perfil</span></div><div class="stat"><b>ID</b><span>Cédula</span></div><div class="stat"><b>Rol</b><span>Auto</span></div></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://lvqzkvahfklwzxbxbljv.supabase.co";
const SUPABASE_KEY="sb_publishable_A122LY08w-r23qZADKtXlA__zPm6E8Q";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function showTab(tab){registerBox.classList.toggle('hidden',tab!=='reg');loginBox.classList.toggle('hidden',tab!=='log');tabReg.classList.toggle('active',tab==='reg');tabLog.classList.toggle('active',tab==='log')}
function roleFields(){driverFields.classList.toggle('hidden',r.value!=='chofer');compFields.classList.toggle('hidden',r.value!=='acompanante')}
function setMsg(el,msg,color='#FCA5A5'){el.textContent=msg;el.style.color=color}
function previewFile(inputId,imgId){const file=document.getElementById(inputId)?.files?.[0];if(!file)return;const img=document.getElementById(imgId);img.src=URL.createObjectURL(file);img.classList.remove('hidden')}
async function uploadFile(input, folder, userId){const file=input?.files?.[0];if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${userId}/${folder}-${Date.now()}.${ext}`;const up=await supabaseClient.storage.from('ttraigo-docs').upload(path,file,{upsert:true,contentType:file.type||'image/jpeg'});if(up.error)throw new Error('Subiendo '+folder+': '+up.error.message);return supabaseClient.storage.from('ttraigo-docs').getPublicUrl(path).data.publicUrl}
async function profile(){let s=await supabaseClient.auth.getSession();if(!s.data.session)return null;let id=s.data.session.user.id;let r=await supabaseClient.from('usuarios').select('*').eq('id',id).single();return r.data}
async function reg(){const btn=document.querySelector('#registerBox .btn.primary');try{btn.disabled=true;btn.textContent='Creando cuenta...';setMsg(m1,'Creando cuenta y subiendo documentos...','#AAB4C0');if(!n.value||!t.value||!c.value||!e.value||!p.value)throw new Error('Completa nombre, teléfono, cédula, correo y contraseña.');if(!f.files[0])throw new Error('Debes subir o tomar tu foto de perfil.');if(!idfoto.files[0])throw new Error('Debes subir o tomar foto de cédula/ID.');if(p.value.length<6)throw new Error('Contraseña mínimo 6 caracteres.');if(r.value==='chofer'&&(!lic.value||!marca.value||!modelo.value||!placa.value||!fveh.files[0]||!flic.files[0]||!fseg.files[0]||!fdoc.files[0]))throw new Error('Chofer debe subir vehículo, licencia, seguro y matrícula.');const authRes=await supabaseClient.auth.signUp({email:e.value.trim(),password:p.value,options:{emailRedirectTo:location.origin+'/login.html',data:{nombre:n.value,telefono:t.value,cedula:c.value,rol:r.value}}});if(authRes.error)throw authRes.error;const id=authRes.data.user?.id;if(!id)throw new Error('Supabase no devolvió ID.');const perfilUrl=await uploadFile(f,'perfil',id);const idUrl=await uploadFile(idfoto,'cedula-id',id);const u=await supabaseClient.from('usuarios').upsert([{id,nombre:n.value,telefono:t.value,email:e.value.trim(),rol:r.value,cedula_id:c.value,tipo_documento:'cedula',foto_perfil_url:perfilUrl,foto_id_url:idUrl,verificado:r.value==='cliente',documento_verificado:false}],{onConflict:'id'});if(u.error)throw new Error('Perfil usuario: '+u.error.message);if(r.value==='chofer'){const vehUrl=await uploadFile(fveh,'vehiculo',id);const licUrl=await uploadFile(flic,'licencia',id);const segUrl=await uploadFile(fseg,'seguro',id);const docUrl=await uploadFile(fdoc,'matricula',id);const ch=await supabaseClient.from('choferes').insert([{usuario_id:id,nombre:n.value,licencia:lic.value,vehiculo_marca:marca.value,vehiculo_modelo:modelo.value,placa:placa.value,foto_cedula_url:idUrl,foto_vehiculo_url:vehUrl,foto_licencia_url:licUrl,foto_seguro_url:segUrl,foto_documento_url:docUrl,estado_verificacion:'pendiente'}]);if(ch.error)throw new Error('Perfil chofer: '+ch.error.message)}if(r.value==='acompanante'){const ac=await supabaseClient.from('acompanantes').insert([{usuario_id:id,cedula:c.value,experiencia:exp.value,foto_cedula_url:idUrl,foto_perfil_url:perfilUrl,estado_verificacion:'pendiente'}]);if(ac.error)throw new Error('Perfil acompañante: '+ac.error.message)}setMsg(m1,'Cuenta creada correctamente. Ahora entra con tu correo y contraseña.','#16C47F');showTab('log');le.value=e.value.trim()}catch(err){console.error(err);setMsg(m1,'Error real: '+(err.message||JSON.stringify(err)||err),'#FCA5A5')}finally{btn.disabled=false;btn.textContent='Crear cuenta'}}
async function log(){const btn=document.querySelector('#loginBox .btn.primary');try{btn.disabled=true;btn.textContent='Entrando...';setMsg(m2,'Validando acceso...','#AAB4C0');const a=await supabaseClient.auth.signInWithPassword({email:le.value.trim(),password:lp.value});if(a.error)throw a.error;let pr=await profile();if(!pr)throw new Error('Cuenta existe, pero falta perfil en tabla usuarios.');location.href=pr.rol==='chofer'?'chofer.html':pr.rol==='acompanante'?'acompanante.html':pr.rol==='admin'?'admin.html':'cliente.html'}catch(err){console.error(err);setMsg(m2,'Error real: '+(err.message||JSON.stringify(err)||err),'#FCA5A5')}finally{btn.disabled=false;btn.textContent='Entrar'}}
</script></body></html>
