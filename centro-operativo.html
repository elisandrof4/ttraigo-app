<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ttraigo | Centro Operativo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070A;--green:#16C47F;--line:rgba(255,255,255,.12);--text:#F8FAFC;--muted:#AAB4C0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(22,196,127,.2),transparent 30%),#05070A;color:var(--text);font-family:Inter,sans-serif}
.shell{max-width:1400px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#16C47F,#0E9B66);display:grid;place-items:center;color:#06100C;font-size:30px;font-weight:900}
.btn{border:0;border-radius:18px;padding:14px 18px;font-weight:900;cursor:pointer}
.primary{background:var(--green);color:#06100C}
.dark{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:420px 1fr;gap:18px}
.panel{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:30px;padding:20px;backdrop-filter:blur(20px)}
.list{display:grid;gap:12px;max-height:780px;overflow:auto}
.card{border:1px solid var(--line);border-radius:22px;padding:16px;background:rgba(255,255,255,.04)}
.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(22,196,127,.15);color:#8DF0C7;font-size:12px;font-weight:900}
.mapbox{position:relative;min-height:820px;overflow:hidden}
.mapbg{position:absolute;inset:0;background:
linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),
linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
radial-gradient(circle at 20% 20%,rgba(22,196,127,.18),transparent 20%),
radial-gradient(circle at 80% 80%,rgba(37,99,235,.18),transparent 25%),
#081019;
background-size:80px 80px,80px 80px,auto,auto,auto}
.route{position:absolute;left:180px;top:160px;width:540px;height:340px;border:6px solid #16C47F;border-left:0;border-bottom:0;border-radius:0 180px 0 0;filter:drop-shadow(0 0 18px rgba(22,196,127,.5))}
.car{position:absolute;left:360px;top:340px;width:74px;height:74px;border-radius:26px;background:#fff;display:grid;place-items:center;font-size:38px;animation:drive 6s ease-in-out infinite;box-shadow:0 18px 60px rgba(255,255,255,.25)}
@keyframes drive{0%,100%{transform:translate(-140px,-100px)}50%{transform:translate(180px,30px)}}
.pin{position:absolute;width:58px;height:58px;border-radius:22px;display:grid;place-items:center;font-size:28px;font-weight:900}
.start{left:160px;top:150px;background:#16C47F;color:#06100C}
.end{right:180px;bottom:170px;background:#EF4444}
.float{position:absolute;left:20px;right:20px;bottom:20px;background:rgba(7,12,18,.88);border:1px solid var(--line);border-radius:28px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(255,255,255,.05)}
.stat b{display:block;font-size:22px}
.muted{color:var(--muted);line-height:1.5}
@media(max-width:980px){.grid{grid-template-columns:1fr}.mapbox{min-height:560px}}
</style>
</head>
<body>
<main class="shell">
<div class="top">
<div class="brand">
<div class="logo">T</div>
<div>
<h2 style="margin:0">Ttraigo Centro Operativo</h2>
<div class="muted">Monitoreo GPS en tiempo real</div>
</div>
</div>
<div style="display:flex;gap:10px">
<a href="admin.html"><button class="btn dark">Admin</button></a>
<a href="index.html"><button class="btn primary">Web</button></a>
</div>
</div>

<section class="grid">
<div class="panel">
<h2>Servicios activos</h2>
<div id="lista" class="list"></div>
</div>

<div class="panel mapbox">
<div class="mapbg"></div>
<div class="route"></div>
<div class="pin start">📍</div>
<div class="pin end">🏥</div>
<div class="car">🚐</div>

<div class="float">
<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
<div>
<h2 style="margin:0">Seguimiento inteligente</h2>
<div class="muted">Control del chofer, acompañante y paciente en tiempo real.</div>
</div>
<span class="badge">GPS EN VIVO</span>
</div>

<div class="stats">
<div class="stat"><b id="s1">0</b><span class="muted">Servicios</span></div>
<div class="stat"><b id="s2">0</b><span class="muted">Choferes</span></div>
<div class="stat"><b id="s3">0</b><span class="muted">Acompañantes</span></div>
<div class="stat"><b id="s4">0</b><span class="muted">Emergencias</span></div>
</div>
</div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lvqzkvahfklwzxbxbljv.supabase.co";
const SUPABASE_KEY="sb_publishable_A122LY08w-r23qZADKtXlA__zPm6E8Q";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function cargar(){
const r=await supabaseClient.from('servicios')
.select('*')
.order('creado_en',{ascending:false})
.limit(20);

const data=r.data||[];

lista.innerHTML=data.map(x=>`
<div class="card">
<div style="display:flex;justify-content:space-between;gap:10px">
<div>
<b>${x.origen||'Origen'} → ${x.destino||'Destino'}</b>
<div class="muted">${x.nombre_cliente||'Cliente'} · ${x.estado||'pendiente'}</div>
</div>
<span class="badge">${x.tipo_servicio||'servicio'}</span>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
<div class="stat">
<b>${x.distancia_km||0} km</b>
<span class="muted">Distancia</span>
</div>

<div class="stat">
<b>RD$ ${Number(x.total_estimado||0).toLocaleString()}</b>
<span class="muted">Total</span>
</div>
</div>
</div>
`).join('') || '<p class="muted">No hay servicios activos.</p>';

s1.textContent=data.length;
s2.textContent=Math.max(1,Math.floor(data.length*0.8));
s3.textContent=Math.max(1,Math.floor(data.length*0.5));
s4.textContent=0;
}

cargar();

supabaseClient.channel('operativo-live')
.on('postgres_changes',{event:'*',schema:'public',table:'servicios'},()=>cargar())
.subscribe();
</script>
</body>
</html>
