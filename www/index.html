<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ttraigo Mobile Producción</title>
<style>
body{margin:0;background:#05070A;color:white;font-family:Arial,sans-serif}.shell{max-width:1100px;margin:auto;padding:18px}.card{background:#111827;border-radius:22px;padding:18px;margin:12px 0}input,select{width:100%;padding:13px;border-radius:14px;background:#1F2937;color:white;border:1px solid #333;margin-top:8px}button{padding:13px 15px;border:0;border-radius:14px;background:#16C47F;color:#06100C;font-weight:900;margin-top:10px}.dark{background:#263244;color:white}.danger{background:#EF4444;color:white}.item{padding:12px;background:#1A2330;border-radius:14px;margin-top:10px}.muted{color:#AAB4C0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.screen{display:none}.active{display:block}
</style>
</head>
<body>
<div class="shell">
<h1>Ttraigo Mobile Producción</h1>
<p class="muted">Cliente · Chofer · Acompañante. Admin separado para PC/web.</p>

<div class="tabs">
<button onclick="show('login')">Login</button>
<button class="dark" onclick="show('cliente')">Cliente</button>
<button class="dark" onclick="show('chofer')">Chofer</button>
<button class="dark" onclick="show('acompanante')">Acompañante</button>
</div>

<section id="login" class="screen active card">
<h2>Entrar / crear cuenta</h2>
<input id="email" placeholder="Correo">
<input id="password" type="password" placeholder="Contraseña">
<input id="nombre" placeholder="Nombre">
<select id="rol"><option value="cliente">Cliente</option><option value="chofer">Chofer</option><option value="acompanante">Acompañante</option></select>
<button onclick="crearCuenta()">Crear cuenta</button>
<button class="dark" onclick="entrar()">Entrar</button>
<button class="danger" onclick="salir()">Salir</button>
<p id="loginMsg"></p>
<div class="item">Usuario: <b id="perfilTxt">Sin sesión</b></div>
</section>

<section id="cliente" class="screen card">
<h2>Cliente</h2>
<input id="origen" placeholder="Origen">
<input id="destino" placeholder="Destino">
<button onclick="startTracking('cliente')">Activar GPS</button>
<button class="dark" onclick="crearServicio()">Pedir servicio</button>
<button class="danger" onclick="sos()">SOS</button>
<p id="clienteMsg"></p>
<div class="item">Servicio: <b id="servicioTxt">--</b></div>
</section>

<section id="chofer" class="screen card">
<h2>Chofer</h2>
<p class="muted">Esta sección usa Background Geolocation cuando esté disponible en APK.</p>
<input id="servicioChofer" placeholder="ID servicio">
<button onclick="toggleOnline('chofer')">Online / Offline</button>
<button class="dark" onclick="startTracking('chofer')">Iniciar tracking fondo</button>
<button class="dark" onclick="cargarPendientes()">Ver pendientes</button>
<button onclick="aceptarServicio()">Aceptar</button>
<button class="danger" onclick="stopTracking('chofer')">Detener GPS</button>
<p id="choferMsg"></p>
<div id="pendientes"></div>
</section>

<section id="acompanante" class="screen card">
<h2>Acompañante</h2>
<input id="servicioAcom" placeholder="ID servicio">
<button onclick="toggleOnline('acompanante')">Online / Offline</button>
<button class="dark" onclick="startTracking('acompanante')">Iniciar GPS</button>
<button onclick="tomarAcompanamiento()">Tomar servicio</button>
<button class="danger" onclick="stopTracking('acompanante')">Detener GPS</button>
<p id="acomMsg"></p>
</section>
</div>

<script src="config-mapas.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=window.supabase.createClient("https://lvqzkvahfklwzxbxbljv.supabase.co","sb_publishable_A122LY08w-r23qZADKtXlA__zPm6E8Q");
let perfil=null,current={lat:null,lng:null},servicioActivo=null,timers={},bgWatchId=null;

function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function msg(id,t,c='white'){let e=document.getElementById(id);if(e){e.textContent=t;e.style.color=c}}
function isNative(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}
function getMsgId(r){return r==='cliente'?'clienteMsg':r==='chofer'?'choferMsg':'acomMsg'}

async function cargarPerfil(){
  let s=await supabaseClient.auth.getSession();
  if(!s.data.session){perfil=null;perfilTxt.textContent='Sin sesión';return}
  let id=s.data.session.user.id;
  let p=await supabaseClient.from('usuarios').select('*').eq('id',id).maybeSingle();
  perfil=p.data||{id,email:s.data.session.user.email};
  perfilTxt.textContent=(perfil.nombre||perfil.email||perfil.id)+' · '+(perfil.rol||'cliente');
}

async function crearCuenta(){
  try{
    let a=await supabaseClient.auth.signUp({email:email.value.trim(),password:password.value});
    if(a.error)throw a.error;
    let id=a.data.user?.id;
    if(id)await supabaseClient.from('usuarios').upsert([{id,nombre:nombre.value,email:email.value.trim(),rol:rol.value,realtime_rol:rol.value}],{onConflict:'id'});
    msg('loginMsg','Cuenta creada.','#16C47F'); cargarPerfil();
  }catch(e){msg('loginMsg','Error: '+e.message,'#EF4444')}
}

async function entrar(){
  try{
    let a=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value});
    if(a.error)throw a.error;
    cargarPerfil(); msg('loginMsg','Entraste.','#16C47F');
  }catch(e){msg('loginMsg','Error: '+e.message,'#EF4444')}
}

async function salir(){await supabaseClient.auth.signOut();cargarPerfil()}

async function saveGPS(r,p){
  if(!perfil)return;
  current.lat=p.lat; current.lng=p.lng;
  await supabaseClient.from('usuarios').update({
    realtime_online:true,realtime_rol:r,realtime_lat:p.lat,realtime_lng:p.lng,realtime_ultima_conexion:new Date().toISOString()
  }).eq('id',perfil.id);
  await supabaseClient.from('realtime_ubicaciones').insert([{
    usuario_id:perfil.id,servicio_id:servicioActivo||servicioChofer.value||servicioAcom.value||null,rol:r,
    latitud:p.lat,longitud:p.lng,precision_metros:p.accuracy||0,velocidad:p.speed||0,rumbo:p.heading||0
  }]);
}

async function getForegroundPosition(){
  if(isNative()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Geolocation){
    const G=window.Capacitor.Plugins.Geolocation;
    try{await G.requestPermissions()}catch(e){}
    const p=await G.getCurrentPosition({enableHighAccuracy:true,timeout:12000,maximumAge:2000});
    return {lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy||0,speed:p.coords.speed||0,heading:p.coords.heading||0};
  }
  return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res({
    lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy||0,speed:p.coords.speed||0,heading:p.coords.heading||0
  }),rej,{enableHighAccuracy:true,timeout:12000,maximumAge:2000}));
}

async function startTracking(r){
  if(!perfil){alert('Primero entra');return}
  const mid=getMsgId(r);

  const BG = window.Capacitor?.Plugins?.BackgroundGeolocation;
  if(isNative() && BG && r==='chofer'){
    try{
      if(BG.requestPermissions) await BG.requestPermissions();
      if(BG.addWatcher){
        bgWatchId = await BG.addWatcher({
          backgroundMessage:'Ttraigo está compartiendo tu ubicación durante el servicio.',
          backgroundTitle:'Ttraigo tracking activo',
          requestPermissions:true,
          stale:false,
          distanceFilter:10
        }, async (location,error)=>{
          if(error){msg(mid,'Background GPS error: '+JSON.stringify(error),'#EF4444');return}
          await saveGPS(r,{lat:location.latitude,lng:location.longitude,accuracy:location.accuracy,speed:location.speed,heading:location.bearing});
          msg(mid,'GPS de fondo activo y guardando en Supabase.','#16C47F');
        });
        return;
      }
    }catch(e){msg(mid,'Fallback GPS: '+(e.message||e),'#D8B76A')}
  }

  async function tick(){
    try{
      const p=await getForegroundPosition();
      await saveGPS(r,p);
      msg(mid,(isNative()?'GPS nativo':'GPS web')+' guardando en Supabase.','#16C47F');
    }catch(e){msg(mid,'GPS error: '+(e.message||e),'#EF4444')}
  }
  tick(); clearInterval(timers[r]); timers[r]=setInterval(tick,r==='chofer'?5000:8000);
}

async function stopTracking(r){
  clearInterval(timers[r]);
  const BG = window.Capacitor?.Plugins?.BackgroundGeolocation;
  if(BG && bgWatchId && BG.removeWatcher){try{await BG.removeWatcher({id:bgWatchId});}catch(e){}}
  await supabaseClient.from('usuarios').update({realtime_online:false}).eq('id',perfil.id);
  msg(getMsgId(r),'GPS detenido.','#EF4444');
}

async function toggleOnline(r){
  if(!perfil)return;
  let nuevo=!perfil.realtime_online;
  await supabaseClient.from('usuarios').update({realtime_online:nuevo,realtime_rol:r,realtime_ultima_conexion:new Date().toISOString()}).eq('id',perfil.id);
  perfil.realtime_online=nuevo; msg(getMsgId(r),nuevo?'Online':'Offline','#16C47F');
}

async function crearServicio(){
  try{
    let r=await supabaseClient.from('realtime_servicios').insert([{cliente_id:perfil.id,origen:origen.value,destino:destino.value,origen_lat:current.lat,origen_lng:current.lng,estado:'pendiente',precio_estimado:650}]).select().single();
    if(r.error)throw r.error;
    servicioActivo=r.data.id; servicioTxt.textContent=servicioActivo; msg('clienteMsg','Servicio creado.','#16C47F');
  }catch(e){msg('clienteMsg',e.message,'#EF4444')}
}

async function sos(){
  await supabaseClient.from('realtime_sos_mapa').insert([{servicio_id:servicioActivo,usuario_id:perfil.id,rol:'cliente',latitud:current.lat,longitud:current.lng,mensaje:'SOS cliente',estado:'abierta'}]);
  msg('clienteMsg','SOS enviado.','#EF4444');
}

async function cargarPendientes(){
  let r=await supabaseClient.from('realtime_servicios').select('*').eq('estado','pendiente').order('creado_en',{ascending:false}).limit(20);
  pendientes.innerHTML=(r.data||[]).map(s=>`<div class="item"><b>${s.origen} → ${s.destino}</b><br><small>${s.id}</small><br><button onclick="servicioChofer.value='${s.id}'">Seleccionar</button></div>`).join('')||'No hay pendientes';
}

async function aceptarServicio(){
  await supabaseClient.from('realtime_servicios').update({chofer_id:perfil.id,estado:'chofer_asignado'}).eq('id',servicioChofer.value);
  msg('choferMsg','Aceptado','#16C47F');
}

async function tomarAcompanamiento(){
  await supabaseClient.from('realtime_servicios').update({acompanante_id:perfil.id}).eq('id',servicioAcom.value);
  msg('acomMsg','Asignado','#16C47F');
}

cargarPerfil();
</script>
</body>
</html>
