<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin PC Realtime Avanzado</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet">
<style>body{margin:0;background:#05070A;color:white;font-family:Arial,sans-serif}
.shell{max-width:1380px;margin:auto;padding:20px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:18px;background:#16C47F;color:#06100C;display:grid;place-items:center;font-size:28px;font-weight:900}
.grid{display:grid;grid-template-columns:400px 1fr;gap:18px}
.card{background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:20px}
.map{height:720px;border-radius:24px;overflow:hidden;background:#0B1218}
input,select,textarea{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:#1F2937;color:white;margin-top:10px;box-sizing:border-box}
button,.btn{padding:14px 16px;border:0;border-radius:16px;background:#16C47F;color:#06100C;font-weight:900;cursor:pointer;margin-top:10px;text-decoration:none;display:inline-block}
.dark{background:#202B3B;color:white}.danger{background:#EF4444;color:white}.gold{background:#D8B76A;color:#06100C}
.item{padding:14px;border-radius:18px;background:#1A2330;border:1px solid rgba(255,255,255,.08);margin-top:10px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(22,196,127,.16);color:#8DF0C7;font-weight:900;font-size:12px}
.muted{color:#AAB4C0;line-height:1.55}.small{font-size:12px;color:#AAB4C0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.kpi{background:#1A2330;padding:12px;border-radius:16px}
@media(max-width:960px){.grid{grid-template-columns:1fr}.map{height:540px}.kpis{grid-template-columns:1fr}}</style>
</head>
<body>
<div class="shell">
<nav class="nav">
<div class="brand"><div class="logo">T</div><div><b>Admin PC Realtime Avanzado</b><div class="muted">Core Realtime Parte 2</div></div></div>
<div><a class="btn dark" href="index.html">Inicio</a> <a class="btn dark" href="login.html">Login</a></div>
</nav>

<section class="grid">
<div class="card">
<h2>Admin PC — avanzado</h2>
<p class="muted">SOS, matching, rutas históricas y monitoreo realtime.</p>
<input id="servicioId" placeholder="ID servicio para revisar ruta">
<button onclick="cargarTodo()">Actualizar todo</button>
<button class="dark" onclick="verHistorial()">Ver historial de ruta</button>
<button class="danger" onclick="cargarSOS()">Ver SOS abiertos</button>
<p id="msg"></p>
<div class="kpis">
<div class="kpi"><b id="ku">0</b><br><span class="small">Ubicaciones</span></div>
<div class="kpi"><b id="ks">0</b><br><span class="small">Servicios</span></div>
<div class="kpi"><b id="kalert">0</b><br><span class="small">SOS</span></div>
</div>
<div id="lista"></div>
</div>
<div class="card"><div id="map" class="map"></div></div>
</section>

</div>
<script src="config-mapas.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ttraigo-realtime-core.js"></script>
<script src="ttraigo-realtime-core-2.js"></script>
<script>
const supabaseClient=rtCreateSupabase();
let perfil=null,map=null,markers=[];

async function init(){
 perfil=await rtRequireUser(supabaseClient);
 if(!perfil)return;
 map=rtCreateMap("map");
 cargarTodo();
 supabaseClient.channel("admin-rt2")
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"realtime_ubicaciones"},p=>pintarUbicacion(p.new))
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"realtime_sos_mapa"},p=>{rt2PintarSOS(map,p.new);cargarSOS();})
 .subscribe();
}
function limpiar(){markers.forEach(m=>m&&m.remove());markers=[];}
function pintarUbicacion(u){
 if(!u.latitud||!u.longitud)return;
 const color=u.rol==="chofer"?"#16C47F":u.rol==="acompanante"?"#D8B76A":"#3B82F6";
 markers.push(rtMarker(map,u.longitud,u.latitud,color,`<b>${u.rol}</b><br>${u.usuario_id}<br>${new Date(u.creado_en).toLocaleString()}`));
}
async function cargarTodo(){
 limpiar();
 const u=await supabaseClient.from("realtime_ubicaciones").select("*").order("creado_en",{ascending:false}).limit(150);
 const s=await supabaseClient.from("realtime_servicios").select("*").order("creado_en",{ascending:false}).limit(40);
 ku.textContent=(u.data||[]).length; ks.textContent=(s.data||[]).length;
 (u.data||[]).forEach(pintarUbicacion);
 lista.innerHTML=(s.data||[]).map(x=>`<div class="item"><b>${rtEscape(x.origen)} → ${rtEscape(x.destino)}</b><br><span class="badge">${x.estado}</span> ETA ${x.eta_min||0} min · ${rtMoney(x.precio_estimado||x.tarifa_dinamica)}<br><small>${x.id}</small><br><button onclick="servicioId.value='${x.id}'">Seleccionar</button></div>`).join("");
 rtMsg("msg","Admin avanzado actualizado.","#16C47F");
}
async function verHistorial(){
 if(!servicioId.value){rtMsg("msg","Escribe ID servicio.","#EF4444");return}
 await rt2CargarHistorialRuta({supabaseClient,map,servicioId:servicioId.value});
 rtMsg("msg","Historial de ruta cargado.","#16C47F");
}
async function cargarSOS(){
 const r=await supabaseClient.from("realtime_sos_mapa").select("*").eq("estado","abierta").order("creado_en",{ascending:false}).limit(50);
 const data=r.data||[]; kalert.textContent=data.length;
 data.forEach(x=>rt2PintarSOS(map,x));
}
init();
</script>
</body>
</html>
